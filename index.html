<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- 自分のドメイン以外への接続・読み込みをすべて禁止する -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>筋トレ記録</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="view-title" class="topbar-title">筋トレ記録</h1>
    </header>
    <div id="notice-area" class="notice-area"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="画面の切り替え">
      <a class="tab" href="#record" data-tab="record">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>
        <span>記録</span>
      </a>
      <a class="tab" href="#history" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span>履歴</span>
      </a>
      <a class="tab" href="#analysis" data-tab="analysis">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16l4-5 3 3 5-7"/></svg>
        <span>分析</span>
      </a>
      <a class="tab" href="#body" data-tab="body">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9.5a4 4 0 0 1 6 0M12 12l1.5-2.5"/></svg>
        <span>体</span>
      </a>
      <a class="tab" href="#settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        <span>設定</span>
        <span class="tab-dot" id="settings-dot" hidden></span>
      </a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
